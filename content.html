<script type="text/javascript">

function makeTheMask (isShow) {
    var maskDiv =  '\
        <div class="spinner"> \
            <div class="double-bounce1"></div> \
            <div class="double-bounce2"></div> \
    </div> \
    ';


    var mask = document.getElementById('overlayMask');
    if (isShow) {
        if (!mask) {
            var newElement = document.createElement("div");
            newElement.setAttribute("class","overlayMask");
            newElement.setAttribute("id","overlayMask"); 
            newElement.innerHTML = maskDiv
            document.body.appendChild(newElement);
            // document.write(maskDiv);
        }
    } else {
        mask.parentNode.removeChild(mask);
    }
}
   
function getQueryString(name) 
{ 
    var url = location.search; //获取url中"?"符后的字串 
    // console.log('url: ' + url);
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)", "i"); 
    var r = window.location.search.substr(1).match(reg); 
    if (r != null) return unescape(r[2]); return null; 
} 

function requestText(path) 
{
  makeTheMask(true); 
  path = path.replace("../","./");
  
  var xmlhttp;
  if (window.XMLHttpRequest) {
      //针对FireFox，Mozillar，Opera，Safari，IE7，IE8
      xmlhttp = new XMLHttpRequest();
      //针对某些特定版本的mozillar浏览器的BUG进行修正
      if (xmlhttp.overrideMimeType) {
          xmlhttp.overrideMimeType("text/xml");
      }
    } else if (window.ActiveXObject) {
       //针对IE6，IE5.5，IE5
      //两个可以用于创建XMLHTTPRequest对象的控件名称，保存在一个js的数组中
      //排在前面的版本较新
      var activexName = ["MSXML2.XMLHTTP","Microsoft.XMLHTTP"];
      for (var i = 0; i < activexName.length; i++) {
          try{
              //取出一个控件名进行创建，如果创建成功就终止循环
              //如果创建失败，回抛出异常，然后可以继续循环，继续尝试创建
              xmlhttp = new ActiveXObject(activexName[i]);
              break;
          } catch(e){
          }
      }
    }

    //回调函数
    function callback() {
      //5。接收响应数据
      //判断对象的状态是交互完成
      if (xmlhttp.readyState == 4) {
          //判断http的交互是否成功
          if (xmlhttp.status == 200) {
              //获取服务漆器端返回的数据
              //获取服务器段输出的纯文本数据
              var responseText = xmlhttp.responseText;
              showArticle(responseText);
          } else {
              console.log("出错了！！！");
          }
      }
    }

    xmlhttp.onreadystatechange = callback;
    xmlhttp.open("GET", path, true);
    xmlhttp.send();
    
}

function showArticle(responseText) 
{
  makeTheMask(false);
  document.body.innerHTML="";
  var content = '';
  
  responseText = responseText.replace(/.\/image\//g, ".\/file\/image\/");

  content += '<hr><xmp theme="bootstrap">' + responseText + '</xmp>';
  content += '<script src=".\/vender\/js\/strapdownjs\/V0.2\/strapdown.js"><\/script>';
  
  content += '<style type="text/css">code {line-height: 25px;font-family: Georgia, Helvetica, Arial, "Helvetica Neue";font-size:15px;}' ;
  content += 'li, p {line-height:28px; font-size:16px}';
  content += '.container{ margin-right: auto; margin-left: auto; padding-left: 15px; padding-right: 15px; min-width:50px; max-width:800px; font-size: 16px; word-wrap:break-word;}';
  content += '<\/style>';

  document.write(content);
}

function loadData()
{
    var path = getQueryString('path');
    path = decodeURI(path);
    requestText(path);
}

loadData();
