<style type="text/css">
body{text-align: center;}
input {
  margin-top: 100px;
  width: 160px;
  height: 25px;
  border: 1px solid #999999;
}
#submit {
  width: 160px;
  height: 30px;
  margin: 0px auto;
  display:block;
  border: 0px solid #999999;
}
button:visited {
  background-color: red;
}


#wrapper {
  display:none;
  position: absolute;
  z-index: 1;
  top: 0px;
  bottom: 0px;
  left: 0;
  width: 100%;
  background: #ccc;
  overflow: hidden;
}

#scroller {
  position: absolute;
  z-index: 1;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  width: 100%;
  -webkit-transform: translateZ(0);
  -moz-transform: translateZ(0);
  -ms-transform: translateZ(0);
  -o-transform: translateZ(0);
  transform: translateZ(0);
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: none;
  -moz-text-size-adjust: none;
  -ms-text-size-adjust: none;
  -o-text-size-adjust: none;
  text-size-adjust: none;
}

#scroller ul {
  list-style: none;
  padding: 0;
  margin: 0;
  width: 100%;
  text-align: left;
}

#scroller li {
  padding: 0 10px;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
  line-height: 40px;
  border-bottom: 1px solid #ccc;
  border-top: 1px solid #fff;
  background-color: #fafafa;
  font-size: 14px;
}

#scroller li:active, #scroller li:visited {background-color:#929292;}

a { color: #333333;}
a:link, a:visited, a:hover, a:active{ text-decoration:none;}


</style>

<script type="text/javascript">
$(document).ready(function() {
    var pwdEncode = '3e725f21e3e5e4adfaf228515ef082f80352dbd8';
    var cookiePwd = getCookie('the_cookie'); // 读取 cookie
    if (cookiePwd === pwdEncode) {
        loadData();
    } else {
        $("#submit").click(function() {
            var pwd = hex_sha1($("#input").val());
            console.log(pwd);
            if (pwd === pwdEncode) {
                setCookie('the_cookie', pwd); // 存储一个带7天期限的 cookie 
                loadData();
            } else {
                alert("Error!");
            }
        });
    }
});

function loadData() 
{
  $("#wrapper").css({"display": "block"});
  $.getJSON("./data.json", function(data){
      parseData(data);
  });
}

function parseData(data)
{
  for (var i = 0; i < data.length; i++) {
    // console.log("JSON Data: " + data[i].name);
  };
  var liData = new Vue({
        el: '#data',
        data: {
            items: data
          }
  });
  var myScroll = new IScroll('#wrapper', {
      scrollbars: true,
      mouseWheel: true,
      interactiveScrollbars: true,
      shrinkScrollbars: 'scale',
      fadeScrollbars: true
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, false);
  $('a').on('touchend click', function(event){ 
      // alert('This page was just hidden: '+ $(this).text()); 
      window.location.href = "./content.html?path=./file/" + encodeURI(encodeURI($(this).text()));
  });
}


function setCookie(name,value) 
{ 
    var Days = 7; 
    var exp = new Date(); 
    exp.setTime(exp.getTime() + Days*24*60*60*1000); 
    document.cookie = name + "="+ escape (value) + ";expires=" + exp.toGMTString(); 
} 

function getCookie(name) 
{ 
    var arr,reg=new RegExp("(^| )"+name+"=([^;]*)(;|$)");
    if(arr=document.cookie.match(reg))
        return unescape(arr[2]); 
    else 
        return null; 
} 
</script>


</head>

<body>

<input type="password" id="input" />
<br>
<br>
<button id="submit">Submit</button>


<div id="wrapper">
  <div id="scroller">
    <ul id="data">
      <li v-for="item in items"><a href="#">{{ item.name }}</a></li>
    </ul>
  </div>
</div>


</body>



</html>
